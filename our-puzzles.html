<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Puzzles</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap');
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--line:#d3d6da;--tile:#efefe6;--tsel:#5a594e;--tselfg:#fff;--key:#d3d6da;--keyfg:#1a1a1a;--c:#6aaa64;--p:#c9b458;--a:#787c7e;--sel:#dcdcdc;--selline:#c4c4c4;--fw:#aedfee;--fs:#f8cd05;--y:#f9df6d;--g:#a0c35a;--b:#b0c4ef;--pu:#ba81c5;--ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2f2;--mut:#9a9a9a;--line:#3a3a3c;--tile:#2a2a2a;--tsel:#e8e6d8;--tselfg:#121212;--key:#818384;--keyfg:#fff;--a:#3a3a3c;--sel:#4a4a4a;--selline:#5a5a5a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Libre Franklin","Helvetica Neue",Arial,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px 40px}
h1{font:600 1.7rem Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:.82rem;margin:4px 0 16px}
button{font-family:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
nav{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--tile);border-radius:999px;padding:3px;margin:0 auto 18px;max-width:380px}
#ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:var(--bg);border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .35s var(--ease)}
nav button{position:relative;background:none;border:0;padding:9px 0;font-size:.85rem;font-weight:600;color:var(--mut);cursor:pointer;transition:color .2s}
nav button.on{color:var(--fg)}
.ck{display:inline-block;width:0;overflow:hidden;vertical-align:bottom;transition:width .3s var(--ease)}
.dn .ck{width:1.1em}
section{display:none}
section.on{display:block;animation:in .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.info{color:var(--mut);margin:0 0 14px;font-size:.85rem;min-height:1.2em}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:10px 18px;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,color .15s,opacity .2s,transform .1s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.35;cursor:default}
/* wordle */
#wboard{display:flex;flex-direction:column;gap:5px;margin:0 auto 20px;width:min(100%,calc(var(--n)*60px))}
.wr{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px}
.wt{aspect-ratio:1;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.65rem;font-weight:700;transition:border-color .1s}
.wt.f{border-color:var(--mut)}
.wt.c,.wt.p,.wt.a{color:#fff;border-color:transparent}
.wt.c{background:var(--c)}.wt.p{background:var(--p)}.wt.a{background:var(--a)}
.kr{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.kr.h{padding:0 5%}
.k{flex:1;min-width:0;height:52px;border:0;border-radius:5px;background:var(--key);color:var(--keyfg);font-size:.8rem;font-weight:700;cursor:pointer;padding:0;transition:background .25s,transform .08s}
.k.w{flex:1.55;font-size:.7rem}
.k:active{transform:scale(.93)}
.k.c{background:var(--c);color:#fff}.k.p{background:var(--p);color:#fff}.k.a{background:var(--a);color:#fff}
/* connections */
#csolved{display:flex;flex-direction:column;gap:8px}
#csolved:not(:empty){margin-bottom:8px}
.solved{height:72px;border-radius:6px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 10px;color:#121212}
.solved b{font-size:.85rem;text-transform:uppercase}
.solved span{font-size:.8rem}
.y{background:var(--y)}.g{background:var(--g)}.b{background:var(--b)}.pu{background:var(--pu)}
#cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ct{height:72px;background:var(--tile);color:var(--fg);border:0;border-radius:6px;font-size:clamp(.66rem,3.2vw,.82rem);font-weight:700;text-transform:uppercase;cursor:pointer;padding:4px;overflow-wrap:anywhere;transition:background .15s,color .15s,transform .1s}
.ct:active{transform:scale(.96)}
.ct.s{background:var(--tsel);color:var(--tselfg)}
.mist{margin:18px 0 16px;display:flex;justify-content:center;align-items:center;gap:10px;color:var(--mut);font-size:.85rem}
.dots{display:flex;gap:6px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--tsel);transition:transform .35s var(--ease),background .35s,opacity .35s}
.dot.off{transform:scale(.5);opacity:.4;background:var(--line)}
/* strands */
.theme{max-width:340px;margin:0 auto 6px;background:var(--fw);color:#121212;border-radius:8px;padding:9px 14px}
.theme small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.theme b{font-size:1.05rem}
#sCount{margin:0 0 10px}
#curw{height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
#cur{font-size:1.25rem;font-weight:700;letter-spacing:.12em;padding:4px 14px;border-radius:999px;transition:background .2s,color .2s;min-width:0}
#cur:empty{padding:0}
#sbox{position:relative;width:min(100%,340px);aspect-ratio:6/8;margin:0 auto 18px;touch-action:none;user-select:none;-webkit-user-select:none;container-type:inline-size;cursor:pointer}
#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sv polyline{fill:none;stroke-width:.24;stroke-linecap:round;stroke-linejoin:round}
#cl{stroke:var(--selline);transition:opacity .25s}
.lw{stroke:var(--fw)}.ls{stroke:var(--fs)}
#sg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr)}
.sc{display:grid;place-items:center}
.sc b{width:82%;height:82%;border-radius:50%;display:grid;place-items:center;font-size:var(--f);font-weight:700;transition:background .18s,transform .18s var(--ease),box-shadow .3s}
.sc.s b{background:var(--sel);transform:scale(1.04)}
.sc.fw b{background:var(--fw);color:#121212}
.sc.fs b{background:var(--fs);color:#121212}
.sc.hint b{animation:hint 1.4s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 0 4px var(--fw)}}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-10px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:8px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:20;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fin{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;opacity:0;pointer-events:none;transition:opacity .4s}
#fin.on{opacity:1;pointer-events:auto}
#fin div{background:var(--bg);border-radius:14px;padding:30px 24px 24px;max-width:400px;transform:translateY(14px) scale(.96);transition:transform .5s var(--ease)}
#fin.on div{transform:none}
#fin h2{font:600 1.5rem Georgia,serif;margin:0 0 14px}
#fin p{line-height:1.65;white-space:pre-line;margin:0 0 22px;font-size:.95rem}
.cf{position:fixed;top:0;width:8px;height:12px;border-radius:2px;z-index:30;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <nav>
    <i id="ind"></i>
    <button id="t-w" class="on" onclick="tab('w')">Wordle<span class="ck"> &#10003;</span></button>
    <button id="t-c" onclick="tab('c')">Connections<span class="ck"> &#10003;</span></button>
    <button id="t-s" onclick="tab('s')">Strands<span class="ck"> &#10003;</span></button>
  </nav>

  <section id="w" class="on">
    <p class="info" id="whint"></p>
    <div id="wboard"></div>
    <div id="kb"></div>
  </section>

  <section id="c">
    <p class="info">Create four groups of four.</p>
    <div id="csolved"></div>
    <div id="cgrid"></div>
    <div class="mist">Mistakes remaining <span class="dots" id="mist"></span></div>
    <div class="row">
      <button class="btn" onclick="cShuffle()">Shuffle</button>
      <button class="btn" onclick="cClear()">Deselect all</button>
      <button class="btn pri" id="csub" onclick="cSubmit()" disabled>Submit</button>
    </div>
  </section>

  <section id="s">
    <p class="info" id="sCount"></p>
    <div id="curw"><div id="cur"></div></div>
    <div id="sbox">
      <svg id="sv" viewBox="0 0 6 8" preserveAspectRatio="none"><g id="fl"></g><polyline id="cl"/></svg>
      <div id="sg"></div>
    </div>
    <div class="row">
      <button class="btn" onclick="sClear()">Clear</button>
      <button class="btn pri" onclick="sHint()">Hint</button>
    </div>
    <p class="info" style="margin-top:14px">Drag across touching letters, or tap them. Tap the last letter to submit.</p>
  </section>
</div>
<div id="toast"></div>
<div id="fin"><div><h2 id="finT"></h2><p id="finM"></p><button class="btn pri" onclick="$('#fin').classList.remove('on')">Close</button></div></div>

<script>
/* =====================================================================
   EDIT THIS BLOCK ONLY. Everything below it just reads from CONFIG.
   ===================================================================== */
const CONFIG = {
  title: "Our Puzzles",
  subtitle: "Made for you, for our anniversary",

  // Shown after she solves all three games.
  finalTitle: "Happy Anniversary, Srush",
  finalMessage: "You solved every puzzle, which is no surprise as you are the smartest person I know.\n\n\n\nLove, Varun",

  // ---------- WORDLE ----------
  // One secret word (any length from 4 to 7). Six guesses.
  wordle: {
    word: "WIFEY",
    hint: "Hint: The word that describes you to me",
    winMessage: "What I hope to call you soon",
    loseMessage: "The word was WIFEY."   // change if you change the word
  },

  // ---------- CONNECTIONS ----------
  // Exactly 4 groups with exactly 4 words each.
  // Order = difficulty and colour: 1 yellow (easiest), 2 green, 3 blue, 4 purple (hardest).
  // Every word must be unique across all groups.
  connections: [
    { title: "Restraunts that we went to that shut down", words: ["Madeline", "Vaishali", "Felice", "Good Luck"] },
    { title: "Things you ate on Nov 16th",             words: ["Cookie", "Diet Coke", "Maggi", "Chocolate"] },
    { title: "Places where we hang out the most",     words: ["Ground", "Room", "Scooter", "Restraunts"] },
    { title: "Things we've already named",  words: ["Saiyra", "Niva", "Shengu", "Ilajet"] }
  ],

  // ---------- STRANDS ----------
  // The grid is built for you from these words (letters only, no spaces).
  // The spangram is the long word that sums up the theme.
  // The grid size is chosen automatically so every letter belongs to a word (no filler).
  // Total letters across the spangram and all words should be between about 16 and 56.
  strands: {
    theme: "Our favourite things",
    spangram: "NICKNAMES",
    words: ["BUBU", "SRUSHVA", "DHUSKI", "BABE", "BEBSU"]
  }
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const anim = (el,kf,o) => reduce ? {finished:Promise.resolve()} : el.animate(kf,o);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const shuf = (a,r=Math.random)=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const done = {w:false,c:false,s:false};
$('#title').textContent = CONFIG.title;
$('#subtitle').textContent = CONFIG.subtitle;
document.title = CONFIG.title;

function tab(n){
  ['w','c','s'].forEach((k,i)=>{
    $('#'+k).classList.toggle('on',k===n); $('#t-'+k).classList.toggle('on',k===n);
    if(k===n) $('#ind').style.transform = `translateX(${i*100}%)`;
  });
}
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }
function confetti(){
  const cols=['#f9df6d','#a0c35a','#b0c4ef','#ba81c5','#6aaa64','#f8cd05'];
  for(let i=0;i<54;i++){
    const p=document.createElement('i'); p.className='cf'; p.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%6]}`; document.body.appendChild(p);
    anim(p,[{transform:'translateY(-20px) rotate(0)'},{transform:`translateY(105vh) translateX(${(Math.random()-.5)*180}px) rotate(${Math.random()*720}deg)`}],{duration:2400+Math.random()*1600,delay:Math.random()*600,easing:'cubic-bezier(.3,.6,.6,1)',fill:'forwards'}).finished.then(()=>p.remove());
  }
}
function solved(k){
  done[k]=true; $('#t-'+k).classList.add('dn');
  if(done.w&&done.c&&done.s) setTimeout(()=>{
    $('#finT').textContent=CONFIG.finalTitle; $('#finM').textContent=CONFIG.finalMessage.replace(/\\n/g,'\n');
    $('#fin').classList.add('on'); confetti();
  },1500);
}

/* ---------------- WORDLE ---------------- */
const W = CONFIG.wordle.word.toUpperCase().replace(/[^A-Z]/g,''), L = W.length;
let wg='', wr=0, wdone=false, wbusy=false;
$('#whint').textContent = CONFIG.wordle.hint;
$('#wboard').style.setProperty('--n',L);
const rows = [];
for(let r=0;r<6;r++){
  const row=document.createElement('div'); row.className='wr';
  for(let i=0;i<L;i++){ const t=document.createElement('div'); t.className='wt'; row.appendChild(t); }
  $('#wboard').appendChild(row); rows.push(row);
}
const kmap={};
[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Z','X','C','V','B','N','M','DEL']].forEach((r,ri)=>{
  const row=document.createElement('div'); row.className='kr'+(ri===1?' h':'');
  r.forEach(k=>{
    const b=document.createElement('button'); b.className='k'+(k.length>1?' w':'');
    b.textContent = k==='DEL' ? '\u232B' : k; b.setAttribute('aria-label',k); b.onclick=()=>wpress(k); row.appendChild(b); kmap[k]=b;
  }); $('#kb').appendChild(row);
});
const tilesOf = r => [...rows[r].children];
function wshake(){ anim(rows[wr],[{transform:'none'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:400}); }
async function flip(el,cls,delay){
  const a=anim(el,[{transform:'rotateX(0)'},{transform:'rotateX(90deg)'}],{duration:230,delay,easing:'ease-in',fill:'forwards'});
  await a.finished;
  el.classList.remove('f'); el.classList.add(cls);
  const b=anim(el,[{transform:'rotateX(90deg)'},{transform:'rotateX(0)'}],{duration:230,easing:'ease-out'});
  if(a.cancel) a.cancel();
  await b.finished;
}
function wpress(k){
  if(wdone||wbusy) return;
  if(k==='ENTER') return wsubmit();
  if(k==='DEL'){ if(!wg) return; const t=tilesOf(wr)[wg.length-1]; wg=wg.slice(0,-1); t.textContent=''; t.classList.remove('f'); return; }
  if(wg.length<L){
    const t=tilesOf(wr)[wg.length]; wg+=k; t.textContent=k; t.classList.add('f');
    anim(t,[{transform:'scale(.85)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:130,easing:'ease-out'});
  }
}
async function wsubmit(){
  if(wg.length<L){ wshake(); return toast('Not enough letters'); }
  wbusy=true;
  const guess=wg, res=Array(L).fill('a'), pool={}, t=tilesOf(wr);
  for(let i=0;i<L;i++){ if(guess[i]===W[i]) res[i]='c'; else pool[W[i]]=(pool[W[i]]||0)+1; }
  for(let i=0;i<L;i++){ if(res[i]!=='c' && pool[guess[i]]>0){ res[i]='p'; pool[guess[i]]--; } }
  wg='';
  await Promise.all(t.map((el,i)=>flip(el,res[i],i*260)));
  const rank={a:1,p:2,c:3};
  guess.split('').forEach((ch,i)=>{
    const kb=kmap[ch], cur=['a','p','c'].find(c=>kb.classList.contains(c));
    if(!cur||rank[res[i]]>rank[cur]){ kb.classList.remove('a','p','c'); kb.classList.add(res[i]); }
  });
  if(guess===W){
    wdone=true;
    await Promise.all(t.map((el,i)=>anim(el,[{transform:'none'},{transform:'translateY(-16px)'},{transform:'translateY(3px)'},{transform:'none'}],{duration:600,delay:i*90,easing:'ease-out'}).finished));
    toast(CONFIG.wordle.winMessage); solved('w');
  } else if(++wr===6){ wdone=true; toast(CONFIG.wordle.loseMessage); }
  wbusy=false;
}
document.addEventListener('keydown',e=>{
  if(!$('#w').classList.contains('on')||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='Enter') wpress('ENTER'); else if(e.key==='Backspace') wpress('DEL');
  else if(/^[a-zA-Z]$/.test(e.key)) wpress(e.key.toUpperCase());
});

/* ---------------- CONNECTIONS ---------------- */
const CC=['y','g','b','pu'], cg=$('#cgrid');
let items=shuf(CONFIG.connections.flatMap((g,gi)=>g.words.map(w=>({w:w.toUpperCase(),g:gi})))), csel=[], cmist=4, cfound=[], cbusy=false, cover=false;
const els=new Map();
items.forEach(i=>{ const b=document.createElement('button'); b.className='ct'; b.textContent=i.w; b.dataset.w=i.w; els.set(i.w,b); });
for(let n=0;n<4;n++){ const d=document.createElement('i'); d.className='dot'; $('#mist').appendChild(d); }
function cUI(){
  [...$('#mist').children].forEach((d,n)=>d.classList.toggle('off',n>=cmist));
  $('#csub').disabled = csel.length!==4||cbusy||cover;
  els.forEach((b,w)=>b.classList.toggle('s',csel.includes(w)));
}
// reorder the grid and glide every tile from where it was to where it is now
function layout(mutate){
  const old=new Map([...els].map(([w,b])=>[w,b.isConnected?b.getBoundingClientRect():null]));
  if(mutate) mutate();
  items.filter(i=>!cfound.includes(i.g)).forEach(i=>cg.appendChild(els.get(i.w)));
  els.forEach((b,w)=>{
    const o=old.get(w); if(!o||!b.isConnected) return;
    const n=b.getBoundingClientRect(), dx=o.left-n.left, dy=o.top-n.top;
    if(dx||dy) anim(b,[{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:480,easing:EASE});
  });
  cUI();
}
function reveal(g){
  layout(()=>{
    cfound.push(g);
    items.filter(i=>i.g===g).forEach(i=>els.get(i.w).remove());
    const d=document.createElement('div'); d.className='solved '+CC[g];
    const t=document.createElement('b'); t.textContent=CONFIG.connections[g].title;
    const s=document.createElement('span'); s.textContent=CONFIG.connections[g].words.join(', ').toUpperCase();
    d.append(t,s); $('#csolved').appendChild(d);
    anim(d,[{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:500,easing:EASE});
  });
}
cg.addEventListener('click',e=>{
  const w=e.target.closest('.ct')?.dataset.w; if(!w||cbusy||cover) return;
  csel = csel.includes(w) ? csel.filter(x=>x!==w) : csel.length<4 ? [...csel,w] : csel; cUI();
});
function cShuffle(){ if(cbusy) return; items=shuf(items); layout(); }
function cClear(){ csel=[]; cUI(); }
async function cSubmit(){
  if(cbusy||csel.length!==4) return;
  cbusy=true; cUI();
  const gs=csel.map(w=>items.find(i=>i.w===w).g), cnt={}, btns=csel.map(w=>els.get(w));
  gs.forEach(g=>cnt[g]=(cnt[g]||0)+1);
  const best=Math.max(...Object.values(cnt));
  if(best===4){
    await Promise.all(btns.map((b,i)=>anim(b,[{transform:'none'},{transform:'translateY(-10px)'},{transform:'none'}],{duration:340,delay:i*80,easing:'ease-out'}).finished));
    csel=[]; reveal(gs[0]);
    if(cfound.length===4){ toast('Perfect!'); solved('c'); }
  } else {
    if(best===3) toast('One away\u2026');
    await Promise.all(btns.map(b=>anim(b,[{transform:'none'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:420}).finished));
    csel=[]; cmist--; cUI();
    if(cmist===0){
      cover=true; toast('Next time. Here are the answers.');
      for(const g of [0,1,2,3].filter(g=>!cfound.includes(g))){ await sleep(500); reveal(g); }
    }
  }
  cbusy=false; cUI();
}
layout(); cUI();

/* ---------------- STRANDS ---------------- */
let R=8, C=6; const S=CONFIG.strands, MIN=4;
const SP=S.spangram.toUpperCase().replace(/[^A-Z]/g,'');
const SW=S.words.map(w=>w.toUpperCase().replace(/[^A-Z]/g,''));
let grid=[], paths=[];
const nb=i=>{ const r=Math.floor(i/C), c=i%C, o=[]; for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){ const rr=r+a, cc=c+b; if((a||b)&&rr>=0&&rr<R&&cc>=0&&cc<C) o.push(rr*C+cc); } return o; };
function seeded(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function buildGrid(){
  const words=[SP,...SW], N=words.reduce((a,w)=>a+w.length,0), dims=[];
  for(let c=4;c<=7;c++)for(let r=4;r<=9;r++) if(r*c>=N&&r*c-N<=6) dims.push([r,c]);
  dims.sort((a,b)=>(a[0]*a[1]-b[0]*b[1])||(Math.abs(a[0]/a[1]-1.33)-Math.abs(b[0]/b[1]-1.33)));
  for(const [r,c] of dims){
    R=r; C=c;
    for(let attempt=1;attempt<=250;attempt++){
      const rnd=seeded(attempt*131+r*7+c), blocked=new Set(), g=Array(r*c).fill(''); let budget=0; paths=[];
      const edge=[...g.keys()].filter(i=>{ const y=Math.floor(i/c), x=i%c; return y===0||y===r-1||x===0||x===c-1; });
      shuf(edge,rnd).slice(0,r*c-N).forEach(i=>blocked.add(i));
      const free=i=>g[i]===''&&!blocked.has(i);
      const feasible=rem=>{
        let ok=new Set([0]); rem.forEach(w=>{ ok=new Set([...ok,...[...ok].map(x=>x+w.length)]); });
        const seen=new Set();
        for(let i=0;i<r*c;i++){
          if(!free(i)||seen.has(i)) continue;
          let n=0; const st=[i]; seen.add(i);
          while(st.length){ const x=st.pop(); n++; for(const j of nb(x)) if(free(j)&&!seen.has(j)){ seen.add(j); st.push(j); } }
          if(!ok.has(n)) return false;
        }
        return true;
      };
      const place=(i,word,k,rem,wi,cells)=>{
        if(!free(i)||++budget>30000) return false;
        g[i]=word[k]; cells.push(i);
        if(k===word.length-1){
          const nrem=rem.filter((_,j)=>j!==wi);
          if(feasible(nrem)&&solve(nrem)){ paths.push({w:rem[wi],cells:word===rem[wi]?cells.slice():cells.slice().reverse()}); return true; }
        } else for(const j of shuf(nb(i),rnd)) if(place(j,word,k+1,rem,wi,cells)) return true;
        g[i]=''; cells.pop(); return false;
      };
      const solve=rem=>{
        if(!rem.length) return true;
        const s=g.findIndex((x,i)=>free(i)); if(s<0) return false;
        for(const wi of shuf([...rem.keys()],rnd)) for(const word of [rem[wi],[...rem[wi]].reverse().join('')]) if(place(s,word,0,rem,wi,[])) return true;
        return false;
      };
      if(solve(words)){ grid=g; return; }
    }
  }
  R=8; C=6; grid=Array(R*C).fill('?'); toast('These words will not fit together. Try fewer or shorter Strands words.');
}
buildGrid();
const sg=$('#sg'), cl=$('#cl'), fl=$('#fl'), box=$('#sbox'), cur=$('#cur'), sc=[];
box.style.width=`min(100%,${C*58}px)`; box.style.aspectRatio=`${C}/${R}`; box.style.setProperty('--f',(37/C)+'cqw');
$('#sv').setAttribute('viewBox',`0 0 ${C} ${R}`);
sg.style.gridTemplateColumns=`repeat(${C},1fr)`; sg.style.gridTemplateRows=`repeat(${R},1fr)`;
grid.forEach(l=>{ const d=document.createElement('div'); d.className='sc'; if(l){ d.innerHTML='<b></b>'; d.firstChild.textContent=l; } sg.appendChild(d); sc.push(d); });
let path=[], sfound={}, sw=new Set(), sSpDone=false, hinted=null, curTok=0;
const pts=a=>a.map(i=>`${i%C+.5},${Math.floor(i/C)+.5}`).join(' ');
function draw(){
  sc.forEach((d,i)=>{ d.classList.toggle('s',path.includes(i)); });
  cl.setAttribute('points',pts(path)); cl.style.opacity=1;
  curTok++; cur.style.background=''; cur.style.color=''; cur.textContent=path.map(i=>grid[i]).join('');
  $('#sCount').textContent=(sw.size+(sSpDone?1:0))+' of '+(SW.length+1)+' theme words found';
}
function cellAt(e,r){
  const b=box.getBoundingClientRect(), x=(e.clientX-b.left)/b.width*C, y=(e.clientY-b.top)/b.height*R;
  const c=Math.floor(x), rw=Math.floor(y); if(c<0||c>=C||rw<0||rw>=R) return -1;
  return grid[rw*C+c]&&Math.hypot(x-c-.5,y-rw-.5)<r ? rw*C+c : -1;
}
let drag=false, moved=false;
box.addEventListener('pointerdown',e=>{
  const i=cellAt(e,.5); if(i<0||sfound[i]) return;
  e.preventDefault(); box.setPointerCapture(e.pointerId); drag=true; moved=false;
  if(path.length){
    const last=path[path.length-1];
    if(i===last){ drag=false; return sSubmit(); }
    if(path.includes(i)) path=path.slice(0,path.indexOf(i)+1);
    else if(nb(last).includes(i)) path.push(i);
    else path=[i];
  } else path=[i];
  draw();
});
box.addEventListener('pointermove',e=>{
  if(!drag) return;
  const i=cellAt(e,.4); if(i<0||sfound[i]) return;
  const n=path.length, last=path[n-1];
  if(i===last) return;
  if(path[n-2]===i){ path.pop(); moved=true; draw(); }
  else if(!path.includes(i)&&nb(last).includes(i)){ path.push(i); moved=true; draw(); }
});
const up=()=>{ if(!drag) return; drag=false; if(moved) sSubmit(); };
box.addEventListener('pointerup',up); box.addEventListener('pointercancel',()=>{ drag=false; });
function sClear(){ path=[]; draw(); }
function flash(word,cls){
  const tok=++curTok; cur.textContent=word; cur.style.background=`var(--${cls})`; cur.style.color='#121212';
  anim(cur,[{transform:'scale(.9)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:350,easing:EASE});
  setTimeout(()=>{ if(tok===curTok){ cur.textContent=''; cur.style.background=''; } },1100);
}
function sSubmit(){
  const w=path.map(i=>grid[i]).join(''), cells=path.slice();
  if(w.length<MIN){ if(w.length>1) toast('Words must be '+MIN+'+ letters'); return sClear(); }
  const isSp = w===SP && !sSpDone, isW = SW.includes(w) && !sw.has(w);
  if(isSp||isW){
    const k=isSp?'ls':'lw', f=isSp?'fs':'fw';
    if(isSp) sSpDone=true; else sw.add(w);
    cells.forEach((i,n)=>{ sfound[i]=f; sc[i].classList.remove('s','hint'); sc[i].classList.add(f); anim(sc[i].firstChild,[{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:420,delay:n*45,easing:EASE}); });
    const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline'); pl.setAttribute('points',pts(cells)); pl.setAttribute('class',k); fl.appendChild(pl);
    anim(pl,[{opacity:0},{opacity:1}],{duration:300,easing:'ease-out'});
    path=[]; cl.setAttribute('points',''); sc.forEach((d,i)=>d.classList.toggle('s',false));
    $('#sCount').textContent=(sw.size+(sSpDone?1:0))+' of '+(SW.length+1)+' theme words found';
    flash(w,isSp?'fs':'fw'); toast(isSp?'Spangram!':'Nice one');
    if(sSpDone&&sw.size===SW.length){ setTimeout(()=>toast('You found them all!'),900); solved('s'); }
  } else {
    const dup=sw.has(w)||(w===SP&&sSpDone); toast(dup?'Already found':'Not a theme word');
    anim(cur,[{transform:'none'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:380});
    cl.style.opacity=0; setTimeout(()=>{ path=[]; draw(); },260);
  }
}
function sHint(){
  sc.forEach(d=>d.classList.remove('hint'));
  const p=paths.find(p=>p.w!==SP&&!sw.has(p.w))||paths.find(p=>p.w===SP&&!sSpDone);
  if(!p) return toast('You already found everything!');
  p.cells.forEach(i=>sc[i].classList.add('hint')); toast('Look for a word in the glowing letters');
}
draw();
</script>
</body>
</html>
